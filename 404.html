<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — MindfulSyntax</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; background: #efe9dc; color: #263a2c; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, #f7f1e3, #e7decb); }
    .card { width: min(560px, 100%); padding: 44px 32px; text-align: center; border: 1px solid rgba(54, 76, 57, .22); border-radius: 22px; background: rgba(255, 252, 244, .72); box-shadow: 0 24px 80px rgba(52, 62, 44, .12); }
    .stamp { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 20px; border: 1px solid #8d9b7c; border-radius: 50%; color: #4e674f; font-size: 28px; }
    .kicker { font: 600 11px/1.4 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #75806b; }
    h1 { margin: 10px 0 14px; font-size: clamp(32px, 6vw, 48px); font-weight: 400; line-height: 1.05; }
    p { margin: 0 auto 26px; max-width: 400px; font: 16px/1.65 system-ui, sans-serif; color: #5b6656; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; padding: 0 20px; border-radius: 999px; text-decoration: none; font: 600 13px/1 system-ui, sans-serif; }
    .primary { color: #fffdf7; background: #35543c; }
    .ghost { color: #35543c; border: 1px solid rgba(53, 84, 60, .35); }
  </style>
</head>
<body>
  <main class="card">
    <div class="stamp">道</div>
    <span class="kicker">MindfulSyntax</span>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела или в адресе ошибка. Вернись в сад — там всё на месте.</p>
    <div class="actions">
      <a class="primary" href="/MindfulSyntax/#/">На главную</a>
      <a class="ghost" href="/MindfulSyntax/#/login">Войти</a>
    </div>
  </main>
  <script>
    // Если GitHub Pages открыл 404 для ссылки подтверждения, не теряем токены.
    if (location.hash.includes("access_token=")) {
      location.replace("/MindfulSyntax/" + location.hash);
    }
  </script>
</body>
</html>
